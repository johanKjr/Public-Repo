<!--
═══════════════════════════════════════════════════════════════════
  TIDSOVERSIGT — iPad vægdisplay
═══════════════════════════════════════════════════════════════════

  FORMÅL
  Et minimalistisk always-on display til iPad i landscape-tilstand,
  der viser tre progress bars: dag, uge og år. Designet til at hænge
  på væggen og give et hurtigt overblik over hvor langt man er i
  henholdsvis dagen, ugen og året.

  BRUG
  Åbn filen lokalt i Safari på iPad (ingen internet nødvendigt).
  Gem til hjemskærm for fuld skærm uden browserbjælke.
  Brug Guided Access / Styret adgang (Indstillinger → Tilgængelighed)
  som kiosk-tilstand. Siden opdaterer automatisk hvert 10. minut.

  ─── DAG BAR ───────────────────────────────────────────────────
  Viser timerne fra kl. 06 til 20 (DAY_START / DAY_END).
  Den aktuelle time vises delvist fyldt — kun de minutter der er
  gået lyser. Timer før er fuldt tændte, timer efter er slukket.
  Yderst til venstre: halen af kl. 05 (altid tændt) — viser at
  der er tid før vinduet. Yderst til højre: starten af kl. 20
  (altid slukket) — viser at natten fortsætter.
  Events med ikoner er konfigureret i DAY_EVENTS.

  ─── UGE BAR ───────────────────────────────────────────────────
  Viser ugens 7 dage, mandag først.
  Hverdage (man–fre): lilla. Weekend (lør–søn): pink.
  Dagens segment er delvist fyldt baseret på tidspunkt på dagen.
  Ikoner over specifikke ugedage konfigureres i WEEK_DAY_ICONS.

  ─── ÅR BAR ────────────────────────────────────────────────────
  Viser årets 12 måneder, bredde proportional med antal dage.
  Tager højde for skudår automatisk.
  Farver skifter med årstid:
    Vinter (dec–feb): kold blå  #4fc3f7
    Forår  (mar–maj): grøn      #66bb6a
    Sommer (jun–aug): orange    #ffa726
    Efterår(sep–nov): brun      #bf7a3a
  Særlige datoer med ikoner konfigureres i SPECIAL_DATES.
  Aktuelt: 🇩🇰 på 31/1, 14/5, 5/7, 15/8 — samt 🎅 på 24/12.

  ─── DESIGN ────────────────────────────────────────────────────
  Mørk baggrund (#0a0a0f) for lavt strømforbrug og god læsbarhed
  ved lav skærmlysstyrke. Mættede farver sikrer synlighed på
  afstand. Hvid markørlinje viser præcis aktuel position.
  Segmenter alternerer mellem to vertikale positioner (op/ned)
  for nem skelnen. Border på hvert segment viser altid fill-farven
  uanset om segmentet er tændt eller slukket.
  Marker lines are positioned using pixel-accurate calculations that
  account for segment borders and gaps, ensuring the marker aligns
  precisely with the fill boundary in all three bars.
  Ghost segments on the day bar (left/right edges) have open borders
  on the screen edge to suggest the bar continues off-screen.
  Fonte: Space Mono (labels/titler), DM Sans (generel tekst).

  ─── KONFIGURATION (find disse konstanter øverst i <script>) ───
  DAY_START / DAY_END   — dagvinduets timer
  DAY_EVENTS            — ikoner og tidspunkter på dagsbaren
  WEEK_DAY_ICONS        — ikoner over ugedage
  SPECIAL_DATES         — særlige datoer på årsbar
  GHOST_FRAC            — bredde af ghost-segmenter (kl. 5 og 20)
  SEG_H                 — segment højde i px
  OFFSET                — vertikal offset for alternerende segmenter

═══════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tidsoversigt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 2vh 0;
  }

  .bar-block { display: flex; flex-direction: column; }
  .bar-block.padded { padding: 0 2vw; }

  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #8888aa;
    margin-bottom: 10px;
  }

  .icons-row {
    position: relative;
    height: 48px;
    margin-bottom: 6px;
  }

  .icon-wrap {
    position: absolute;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .icon-emoji {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
  }
  .icon-arrow {
    width: 2px;
    height: 10px;
    background: rgba(255,255,255,0.3);
    border-radius: 1px;
  }

  /* Bar track is taller to accommodate vertical offset */
  .bar-track {
    position: relative;
    display: flex;
    align-items: flex-start; /* segments position themselves */
    overflow: visible;
  }

  .seg-outer {
    position: relative;
    flex-shrink: 0;
    display: flex;
    overflow: hidden;
    border-radius: 4px;
  }
  .seg-filled, .seg-empty { height: 100%; }

  .marker {
    position: absolute;
    width: 3px;
    background: white;
    border-radius: 2px;
    transform: translateX(-50%);
    z-index: 10;
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  .labels-row {
    position: relative;
    margin-top: 8px;
    height: 20px;
  }
  .label-pin {
    position: absolute;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: #aaaacc;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">

  <div class="bar-block" id="day-block">
    <div class="section-title" style="padding-left:2vw">Dag</div>
    <div class="icons-row" id="day-icons" style="width:100%"></div>
    <div class="bar-track" id="day-bar" style="width:100%"></div>
    <div class="labels-row" id="day-labels" style="width:100%"></div>
  </div>

  <div class="bar-block padded">
    <div class="section-title">Uge</div>
    <div class="icons-row" id="week-icons"></div>
    <div class="bar-track" id="week-bar"></div>
    <div class="labels-row" id="week-labels"></div>
  </div>

  <div class="bar-block padded">
    <div class="section-title">År</div>
    <div class="icons-row" id="year-icons"></div>
    <div class="bar-track" id="year-bar"></div>
    <div class="labels-row" id="year-labels"></div>
  </div>

</div>
<script>
// ══════════════════════════════════════════════════════
// CONFIGURATION
// ══════════════════════════════════════════════════════

const DAY_START = 6;
const DAY_END   = 20;

const DAY_EVENTS = [
  { hour: 7,    icon: '☀️' },
  { hour: 8,    icon: '📚' },
  { hour: 12,   icon: '🥪' },
  { hour: 17.5, icon: '🍲' },
  { hour: 19,   icon: '🛏️' },
];

const WEEK_DAY_ICONS = [
  { dayIndex: 2, icon: '⚽' },
  { dayIndex: 2, icon: '🏒' },
];

const SPECIAL_DATES = [
  { month: 0,  day: 31, icon: '🇩🇰' },
  { month: 4,  day: 14, icon: '🇩🇰' },
  { month: 6,  day: 5,  icon: '🇩🇰' },
  { month: 7,  day: 15, icon: '🇩🇰' },
  { month: 11, day: 24, icon: '🎅' },
];

const GHOST_FRAC = 0.04;

// Segment geometry
const SEG_H  = 70;   // height of each segment in px
const OFFSET = 22;   // vertical offset for alternating segments in px
const TRACK_H = SEG_H + OFFSET; // total bar track height
const GAP    = 3;    // gap between segments in px
const BORDER = 3;    // border width in px

// ══════════════════════════════════════════════════════
// COLOURS
// ══════════════════════════════════════════════════════
const C = {
  dayFill:    '#4a9eff', dayEmpty:    '#1a1a2e',
  wdFill:     '#7c4dff', wdEmpty:     '#1a1a2e',
  weFill:     '#ff4d8d', weEmpty:     '#2a1020',
  winter:     '#4fc3f7', winterEmpty: '#0d1a24',
  spring:     '#66bb6a', springEmpty: '#0d1f0e',
  summer:     '#ffa726', summerEmpty: '#241a08',
  autumn:     '#bf7a3a', autumnEmpty: '#1c1008',
};

const MONTHS = [
  {name:'Jan',days:31,fill:C.winter,empty:C.winterEmpty},
  {name:'Feb',days:28,fill:C.winter,empty:C.winterEmpty},
  {name:'Mar',days:31,fill:C.spring,empty:C.springEmpty},
  {name:'Apr',days:30,fill:C.spring,empty:C.springEmpty},
  {name:'Maj',days:31,fill:C.spring,empty:C.springEmpty},
  {name:'Jun',days:30,fill:C.summer,empty:C.summerEmpty},
  {name:'Jul',days:31,fill:C.summer,empty:C.summerEmpty},
  {name:'Aug',days:31,fill:C.summer,empty:C.summerEmpty},
  {name:'Sep',days:30,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Okt',days:31,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Nov',days:30,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Dec',days:31,fill:C.winter,empty:C.winterEmpty},
];

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function makeIconPin(container, leftPct, emoji) {
  const wrap = document.createElement('div');
  wrap.className = 'icon-wrap';
  wrap.style.left = leftPct + '%';
  const em = document.createElement('div'); em.className = 'icon-emoji'; em.textContent = emoji;
  const arr = document.createElement('div'); arr.className = 'icon-arrow';
  wrap.appendChild(em); wrap.appendChild(arr);
  container.appendChild(wrap);
}

function makeLabelPin(container, leftPct, text) {
  const pin = document.createElement('div');
  pin.className = 'label-pin';
  pin.style.left = leftPct + '%';
  pin.textContent = text;
  container.appendChild(pin);
}

// index: 0-based segment index (for alternating offset)
// fillColor: the "lit" color (also used for border always)
// emptyColor: background when not lit
// fillFrac: 0=all empty, 1=all filled, 0<x<1=partial
// widthPct: percentage width of this segment
// openLeft: no left border (ghost segment extending off left edge)
// openRight: no right border (ghost segment extending off right edge)
function makeSegment(index, fillColor, emptyColor, fillFrac, widthPct, openLeft, openRight) {
  const outer = document.createElement('div');
  outer.className = 'seg-outer';
  outer.style.width = `calc(${widthPct}% - ${GAP}px)`;
  outer.style.marginRight = GAP + 'px';
  outer.style.height = SEG_H + 'px';
  const bL = openLeft  ? '0' : `${BORDER}px`;
  const bR = openRight ? '0' : `${BORDER}px`;
  outer.style.borderTop    = `${BORDER}px solid ${fillColor}`;
  outer.style.borderBottom = `${BORDER}px solid ${fillColor}`;
  outer.style.borderLeft   = `${bL} solid ${fillColor}`;
  outer.style.borderRight  = `${bR} solid ${fillColor}`;
  // Alternating vertical offset: even=top, odd=offset down
  outer.style.marginTop = (index % 2 === 0 ? 0 : OFFSET) + 'px';

  if (fillFrac >= 1) {
    const f = document.createElement('div');
    f.className = 'seg-filled';
    f.style.cssText = `background:${fillColor};width:100%`;
    outer.appendChild(f);
  } else if (fillFrac <= 0) {
    const e = document.createElement('div');
    e.className = 'seg-empty';
    e.style.cssText = `background:${emptyColor};width:100%`;
    outer.appendChild(e);
  } else {
    const f = document.createElement('div');
    f.className = 'seg-filled';
    f.style.cssText = `background:${fillColor};width:${fillFrac*100}%`;
    outer.appendChild(f);
    const e = document.createElement('div');
    e.className = 'seg-empty';
    e.style.cssText = `background:${emptyColor};width:${(1-fillFrac)*100}%`;
    outer.appendChild(e);
  }
  return outer;
}

function addMarker(bar, leftPct) {
  const m = document.createElement('div');
  m.className = 'marker';
  m.style.left = leftPct + '%';
  m.style.top = '0px';
  m.style.height = TRACK_H + 'px';
  bar.appendChild(m);
}

function setTrackHeight(bar) {
  bar.style.height = TRACK_H + 'px';
}

// ══════════════════════════════════════════════════════
// RENDER — DAG
// ══════════════════════════════════════════════════════
function renderDay(now) {
  const bar    = document.getElementById('day-bar');
  const labels = document.getElementById('day-labels');
  const icons  = document.getElementById('day-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';
  setTrackHeight(bar);

  const totalHours = DAY_END - DAY_START;
  const MAIN_FRAC  = 1 - 2 * GHOST_FRAC;
  const segW = MAIN_FRAC * 100 / totalHours;

  const currentHour = now.getHours();
  const currentMin  = now.getMinutes();

  // Left ghost — always lit, open left edge (extends off screen)
  const gL = makeSegment(0, C.dayFill, C.dayEmpty, 1, GHOST_FRAC * 100, true, false);
  gL.style.width = `calc(${GHOST_FRAC * 100}% - ${GAP}px)`;
  bar.appendChild(gL);

  for (let h = 0; h < totalHours; h++) {
    const hour = DAY_START + h;
    const fillFrac = hour < currentHour ? 1 : hour === currentHour ? currentMin / 60 : 0;
    // h+1 so first real hour (6) is index 1 → offset down, alternates from there
    const seg = makeSegment(h + 1, C.dayFill, C.dayEmpty, fillFrac, segW);
    bar.appendChild(seg);
  }

  // Right ghost — always dark, open right edge (extends off screen)
  const gR = makeSegment(totalHours + 1, C.dayFill, C.dayEmpty, 0, GHOST_FRAC * 100, false, true);
  gR.style.width = `calc(${GHOST_FRAC * 100}% - ${GAP}px)`;
  bar.appendChild(gR);

  // Labels
  for (let h = 0; h <= totalHours; h++) {
    makeLabelPin(labels, GHOST_FRAC*100 + h/totalHours*MAIN_FRAC*100, DAY_START + h);
  }

  // Event icons
  DAY_EVENTS.forEach(e => {
    const pct = GHOST_FRAC*100 + (e.hour - DAY_START) / totalHours * MAIN_FRAC * 100;
    makeIconPin(icons, pct, e.icon);
  });

  // Marker — pixel-accurate, accounting for ghost segment, gaps and borders
  const dayBarEl = document.getElementById('day-bar');
  const barW2 = dayBarEl.offsetWidth || 800;
  // Ghost left segment width in px (including its gap)
  const ghostSegPx = GHOST_FRAC * barW2;
  // Each real segment's total width in px (including gap)
  const realSegTotalPx = MAIN_FRAC * barW2 / totalHours;
  // Inner content width of a real segment (excluding border and gap)
  const innerHourW = realSegTotalPx - GAP - 2 * BORDER;
  const clampedHour2 = Math.max(DAY_START, Math.min(currentHour, DAY_END - 1));
  const clampedMin2  = clampedHour2 === currentHour ? currentMin : (currentHour < DAY_START ? 0 : 60);
  const hIdx = clampedHour2 - DAY_START;
  // Position: ghost width + hIdx full segments + left border of current segment + fill fraction
  const fillPx2 = ghostSegPx + hIdx * realSegTotalPx + BORDER + (clampedMin2 / 60) * innerHourW;
  addMarker(dayBarEl, fillPx2 / barW2 * 100);
}

// ══════════════════════════════════════════════════════
// RENDER — UGE
// ══════════════════════════════════════════════════════
function renderWeek(now) {
  const bar    = document.getElementById('week-bar');
  const labels = document.getElementById('week-labels');
  const icons  = document.getElementById('week-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';
  setTrackHeight(bar);

  const jsDay    = now.getDay();
  const todayIdx = (jsDay + 6) % 7;
  const dayFrac  = (now.getHours() * 60 + now.getMinutes()) / (24 * 60);
  const DAY_NAMES = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];

  DAY_NAMES.forEach((name, i) => {
    const weekend = i >= 5;
    const fc = weekend ? C.weFill  : C.wdFill;
    const ec = weekend ? C.weEmpty : C.wdEmpty;
    const fillFrac = i < todayIdx ? 1 : i === todayIdx ? dayFrac : 0;
    bar.appendChild(makeSegment(i, fc, ec, fillFrac, 100/7));
    makeLabelPin(labels, (i+0.5)/7*100, name);
  });

  const grouped = {};
  WEEK_DAY_ICONS.forEach(wi => {
    if (!grouped[wi.dayIndex]) grouped[wi.dayIndex] = [];
    grouped[wi.dayIndex].push(wi.icon);
  });
  Object.entries(grouped).forEach(([di, ics]) => {
    const basePct = (parseInt(di)+0.5)/7*100;
    ics.forEach((icon, ii) => {
      const offset = ics.length > 1 ? (ii-(ics.length-1)/2)*2.5 : 0;
      makeIconPin(icons, basePct+offset, icon);
    });
  });

  // Marker: account for gaps and borders so it aligns with fill boundary
  // Each segment's visual fill area is slightly narrower than its % width due to gap+border
  // We calculate the pixel-accurate position using the bar's rendered width
  const weekBarEl = document.getElementById('week-bar');
  const barW = weekBarEl.offsetWidth || 800; // fallback
  const totalGapBorder = 7 * (GAP + 2 * BORDER); // total px consumed by gaps+borders across 7 segs
  const innerSegW = (barW - totalGapBorder) / 7; // inner content width per segment
  const segStartPx = todayIdx * (innerSegW + GAP + 2 * BORDER) + BORDER; // left edge of filled area
  const fillPx = segStartPx + dayFrac * innerSegW;
  addMarker(bar, fillPx / barW * 100);
}

// ══════════════════════════════════════════════════════
// RENDER — ÅR
// ══════════════════════════════════════════════════════
function renderYear(now) {
  const bar    = document.getElementById('year-bar');
  const labels = document.getElementById('year-labels');
  const icons  = document.getElementById('year-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';
  setTrackHeight(bar);

  const year     = now.getFullYear();
  const isLeap   = (year%4===0 && year%100!==0) || year%400===0;
  const mDays    = MONTHS.map((m,i) => i===1 ? {...m, days: isLeap?29:28} : {...m});
  const totalDays = mDays.reduce((s,m)=>s+m.days,0);
  const month    = now.getMonth();
  const date     = now.getDate();

  let cumDays = 0;
  mDays.forEach((m, i) => {
    const wPct    = m.days / totalDays * 100;
    const midPct  = (cumDays + m.days/2) / totalDays * 100;
    const fillFrac = i < month ? 1 : i === month ? (date-1) / m.days : 0;

    bar.appendChild(makeSegment(i, m.fill, m.empty, fillFrac, wPct));
    makeLabelPin(labels, midPct, m.name);

    SPECIAL_DATES.filter(sd => sd.month === i).forEach(sd => {
      makeIconPin(icons, (cumDays + sd.day) / totalDays * 100, sd.icon);
    });

    cumDays += m.days;
  });

  // Marker — pixel-accurate
  const yearBarEl = document.getElementById('year-bar');
  const barW3 = yearBarEl.offsetWidth || 800;
  const totalGapBorder3 = 12 * (GAP + 2 * BORDER);
  let cumInnerPx = 0;
  for (let mi = 0; mi < month; mi++) {
    const innerW = (mDays[mi].days / totalDays) * barW3 - GAP - 2*BORDER;
    cumInnerPx += innerW + GAP + 2*BORDER;
  }
  const curInnerW = (mDays[month].days / totalDays) * barW3 - GAP - 2*BORDER;
  const fillPx3 = cumInnerPx + BORDER + (date-1) / mDays[month].days * curInnerW;
  addMarker(yearBarEl, fillPx3 / barW3 * 100);
}

// ══════════════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════════════
function update() {
  const now = new Date();
  renderDay(now);
  renderWeek(now);
  renderYear(now);
}

// Use rAF to ensure layout is computed before marker placement
requestAnimationFrame(() => update());
setInterval(() => requestAnimationFrame(() => update()), 10 * 60 * 1000);
</script>
</body>
</html>
