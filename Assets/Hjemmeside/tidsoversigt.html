<!--
═══════════════════════════════════════════════════════════════════
  TIDSOVERSIGT — iPad vægdisplay
═══════════════════════════════════════════════════════════════════

  FORMÅL
  Et minimalistisk always-on display til iPad i landscape-tilstand,
  der viser tre progress bars: dag, uge og år. Designet til at hænge
  på væggen og give et hurtigt overblik over hvor langt man er i
  henholdsvis dagen, ugen og året.

  BRUG
  Åbn filen lokalt i Safari på iPad (ingen internet nødvendigt).
  Gem til hjemskærm for fuld skærm uden browserbjælke.
  Brug Guided Access (Indstillinger → Tilgængelighed) som kiosk-tilstand.
  Siden opdaterer automatisk hvert 10. minut.

  ─── DAG BAR ───────────────────────────────────────────────────
  Viser timerne fra kl. 06 til 20 (DAY_START / DAY_END).
  Den aktuelle time vises delvist fyldt — kun de minutter der er
  gået lyser. Timer før er fuldt tændte, timer efter er slukket.
  Yderst til venstre: halen af kl. 05 (altid tændt) — viser at
  der er tid før vinduet. Yderst til højre: starten af kl. 20
  (altid slukket) — viser at natten fortsætter.
  Events med ikoner er konfigureret i DAY_EVENTS.

  ─── UGE BAR ───────────────────────────────────────────────────
  Viser ugens 7 dage, mandag først.
  Hverdage (man–fre): lilla. Weekend (lør–søn): pink.
  Dagens segment er delvist fyldt baseret på tidspunkt på dagen.
  Ikoner over specifikke ugedage konfigureres i WEEK_DAY_ICONS.

  ─── ÅR BAR ────────────────────────────────────────────────────
  Viser årets 12 måneder, bredde proportional med antal dage.
  Tager højde for skudår automatisk.
  Farver skifter med årstid:
    Vinter (dec–feb): kold blå  #4fc3f7
    Forår  (mar–maj): grøn      #66bb6a
    Sommer (jun–aug): orange    #ffa726
    Efterår(sep–nov): brun      #bf7a3a
  Særlige datoer med ikoner konfigureres i SPECIAL_DATES.
  Aktuelt: 🇩🇰 på 31/1, 14/5, 5/7, 15/8 — samt 🎅 på 24/12.

  ─── DESIGN ────────────────────────────────────────────────────
  Mørk baggrund (#0a0a0f) for lavt strømforbrug og god læsbarhed
  ved lav skærmlysstyrke. Mættede farver sikrer synlighed på
  afstand. Hvid markørlinje viser præcis aktuel position.
  Fonte: Space Mono (labels/titler), DM Sans (generel tekst).

  ─── KONFIGURATION (find disse konstanter øverst i <script>) ───
  DAY_START / DAY_END   — dagvinduets timer
  DAY_EVENTS            — ikoner og tidspunkter på dagsbaren
  WEEK_DAY_ICONS        — ikoner over ugedage
  SPECIAL_DATES         — særlige datoer på årsbar
  GHOST_FRAC            — bredde af ghost-segmenter (kl. 5 og 20)

═══════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tidsoversigt</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: 100vw;
    display: flex;
    flex-direction: column;
    gap: 5vh;
  }

  .bar-block { display: flex; flex-direction: column; }
  .bar-block.padded { padding: 0 2vw; }

  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #55556a;
    margin-bottom: 8px;
  }

  .icons-row {
    position: relative;
    height: 34px;
    margin-bottom: 4px;
  }

  .icon-wrap {
    position: absolute;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .icon-emoji { font-size: 18px; line-height: 1; filter: drop-shadow(0 0 4px rgba(255,255,255,0.2)); }
  .icon-arrow { width: 2px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 1px; }

  .bar-track {
    position: relative;
    height: 56px;
    display: flex;
    overflow: visible;
  }
  .bar-track.rounded { border-radius: 6px; overflow: hidden; }
  .bar-track.rounded .seg-outer:first-child { border-radius: 6px 0 0 6px; overflow: hidden; }
  .bar-track.rounded .seg-outer:last-child  { border-radius: 0 6px 6px 0; overflow: hidden; }

  .seg-outer {
    height: 100%;
    display: flex;
    flex-shrink: 0;
    overflow: hidden;
  }
  .seg-outer + .seg-outer { border-left: 1px solid rgba(0,0,0,0.4); }
  .seg-filled, .seg-empty { height: 100%; }

  .marker {
    position: absolute;
    top: -7px; bottom: -7px;
    width: 3px;
    background: white;
    border-radius: 2px;
    transform: translateX(-50%);
    z-index: 10;
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
    pointer-events: none;
  }

  .labels-row {
    position: relative;
    height: 20px;
    margin-top: 6px;
  }
  .label-pin {
    position: absolute;
    transform: translateX(-50%);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: #55556a;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">

  <div class="bar-block">
    <div class="section-title" style="padding-left:2vw">Dag</div>
    <div class="icons-row" id="day-icons" style="width:100%"></div>
    <div class="bar-track" id="day-bar"></div>
    <div class="labels-row" id="day-labels" style="width:100%"></div>
  </div>

  <div class="bar-block padded">
    <div class="section-title">Uge</div>
    <div class="icons-row" id="week-icons"></div>
    <div class="bar-track rounded" id="week-bar"></div>
    <div class="labels-row" id="week-labels"></div>
  </div>

  <div class="bar-block padded">
    <div class="section-title">År</div>
    <div class="icons-row" id="year-icons"></div>
    <div class="bar-track rounded" id="year-bar"></div>
    <div class="labels-row" id="year-labels"></div>
  </div>

</div>
<script>
// ══════════════════════════════════════════════════════
// CONFIGURATION — edit these to customise
// ══════════════════════════════════════════════════════

const DAY_START = 6;   // First full hour shown
const DAY_END   = 20;  // Last full hour shown (exclusive)

// Events shown above the day bar  { hour: decimal, icon: emoji }
const DAY_EVENTS = [
  { hour: 7,    icon: '☀️' },
  { hour: 8,    icon: '📚' },
  { hour: 12,   icon: '🥪' },
  { hour: 17.5, icon: '🍲' },
  { hour: 19,   icon: '🛏️' },
];

// Icons above specific weekdays (0=Mon … 6=Sun)
const WEEK_DAY_ICONS = [
  { dayIndex: 2, icon: '⚽' },
  { dayIndex: 2, icon: '🏒' },
];

// Special dates on the year bar { month: 0-indexed, day, icon }
const SPECIAL_DATES = [
  { month: 0,  day: 31, icon: '🇩🇰' },
  { month: 4,  day: 14, icon: '🇩🇰' },
  { month: 6,  day: 5,  icon: '🇩🇰' },
  { month: 7,  day: 15, icon: '🇩🇰' },
  { month: 11, day: 24, icon: '🎅' },
];

// Ghost segment width as fraction of total day bar
const GHOST_FRAC = 0.04;

// ══════════════════════════════════════════════════════
// COLOURS
// ══════════════════════════════════════════════════════
const C = {
  dayFill:    '#4a9eff', dayEmpty:    '#1a1a2e',
  wdFill:     '#7c4dff', wdEmpty:     '#1a1a2e',
  weFill:     '#ff4d8d', weEmpty:     '#2a1020',
  winter:     '#4fc3f7', winterEmpty: '#0d1a24',
  spring:     '#66bb6a', springEmpty: '#0d1f0e',
  summer:     '#ffa726', summerEmpty: '#241a08',
  autumn:     '#bf7a3a', autumnEmpty: '#1c1008',
};

const MONTHS = [
  {name:'Jan',days:31,fill:C.winter,empty:C.winterEmpty},
  {name:'Feb',days:28,fill:C.winter,empty:C.winterEmpty},
  {name:'Mar',days:31,fill:C.spring,empty:C.springEmpty},
  {name:'Apr',days:30,fill:C.spring,empty:C.springEmpty},
  {name:'Maj',days:31,fill:C.spring,empty:C.springEmpty},
  {name:'Jun',days:30,fill:C.summer,empty:C.summerEmpty},
  {name:'Jul',days:31,fill:C.summer,empty:C.summerEmpty},
  {name:'Aug',days:31,fill:C.summer,empty:C.summerEmpty},
  {name:'Sep',days:30,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Okt',days:31,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Nov',days:30,fill:C.autumn,empty:C.autumnEmpty},
  {name:'Dec',days:31,fill:C.winter,empty:C.winterEmpty},
];

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function makeIconPin(container, leftPct, emoji) {
  const wrap = document.createElement('div');
  wrap.className = 'icon-wrap';
  wrap.style.left = leftPct + '%';
  const em = document.createElement('div'); em.className = 'icon-emoji'; em.textContent = emoji;
  const arr = document.createElement('div'); arr.className = 'icon-arrow';
  wrap.appendChild(em); wrap.appendChild(arr);
  container.appendChild(wrap);
}

function makeLabelPin(container, leftPct, text) {
  const pin = document.createElement('div');
  pin.className = 'label-pin';
  pin.style.left = leftPct + '%';
  pin.textContent = text;
  container.appendChild(pin);
}

function makeSegment(fillColor, emptyColor, fillFrac, widthPct) {
  const outer = document.createElement('div');
  outer.className = 'seg-outer';
  outer.style.width = widthPct + '%';
  if (fillFrac >= 1) {
    const f = document.createElement('div'); f.className='seg-filled'; f.style.cssText=`background:${fillColor};width:100%`; outer.appendChild(f);
  } else if (fillFrac <= 0) {
    const e = document.createElement('div'); e.className='seg-empty'; e.style.cssText=`background:${emptyColor};width:100%`; outer.appendChild(e);
  } else {
    const f = document.createElement('div'); f.className='seg-filled'; f.style.cssText=`background:${fillColor};width:${fillFrac*100}%`; outer.appendChild(f);
    const e = document.createElement('div'); e.className='seg-empty'; e.style.cssText=`background:${emptyColor};width:${(1-fillFrac)*100}%`; outer.appendChild(e);
  }
  return outer;
}

function addMarker(bar, leftPct) {
  const m = document.createElement('div'); m.className = 'marker';
  m.style.left = leftPct + '%';
  bar.appendChild(m);
}

// ══════════════════════════════════════════════════════
// RENDER FUNCTIONS
// ══════════════════════════════════════════════════════
function renderDay(now) {
  const bar    = document.getElementById('day-bar');
  const labels = document.getElementById('day-labels');
  const icons  = document.getElementById('day-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';

  const totalHours = DAY_END - DAY_START;
  const MAIN_FRAC  = 1 - 2 * GHOST_FRAC;
  const segW = MAIN_FRAC * 100 / totalHours;

  const currentHour = now.getHours();
  const currentMin  = now.getMinutes();

  // Left ghost: tail of hour (DAY_START-1) — always lit
  bar.appendChild(makeSegment(C.dayFill, C.dayEmpty, 1, GHOST_FRAC * 100));

  // Real hours
  for (let h = 0; h < totalHours; h++) {
    const hour = DAY_START + h;
    let fillFrac;
    if (hour < currentHour) {
      fillFrac = 1;
    } else if (hour === currentHour) {
      fillFrac = currentMin / 60;
    } else {
      fillFrac = 0;
    }
    bar.appendChild(makeSegment(C.dayFill, C.dayEmpty, fillFrac, segW));
  }

  // Right ghost: head of hour DAY_END — always dark
  bar.appendChild(makeSegment(C.dayFill, C.dayEmpty, 0, GHOST_FRAC * 100));

  // Labels
  for (let h = 0; h <= totalHours; h++) {
    makeLabelPin(labels, GHOST_FRAC*100 + h/totalHours*MAIN_FRAC*100, DAY_START + h);
  }

  // Event icons
  DAY_EVENTS.forEach(e => {
    const pct = GHOST_FRAC*100 + (e.hour - DAY_START) / totalHours * MAIN_FRAC * 100;
    makeIconPin(icons, pct, e.icon);
  });

  // Marker — clamp within day window
  const clampedHour = Math.max(DAY_START, Math.min(currentHour, DAY_END));
  const clampedMin  = clampedHour === currentHour ? currentMin : (currentHour < DAY_START ? 0 : 60);
  const markerPct   = GHOST_FRAC*100 + (clampedHour - DAY_START + clampedMin/60) / totalHours * MAIN_FRAC * 100;
  addMarker(bar, Math.max(GHOST_FRAC*100, Math.min(100 - GHOST_FRAC*100, markerPct)));

  bar.style.overflow = 'visible';
}

function renderWeek(now) {
  const bar    = document.getElementById('week-bar');
  const labels = document.getElementById('week-labels');
  const icons  = document.getElementById('week-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';

  // JS getDay(): 0=Sun,1=Mon...6=Sat → convert to Mon-first (0=Mon...6=Sun)
  const jsDay     = now.getDay();
  const todayIdx  = (jsDay + 6) % 7; // 0=Mon
  const dayFrac   = (now.getHours() * 60 + now.getMinutes()) / (24 * 60);

  const DAY_NAMES = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];

  DAY_NAMES.forEach((name, i) => {
    const weekend = i >= 5;
    const fc = weekend ? C.weFill  : C.wdFill;
    const ec = weekend ? C.weEmpty : C.wdEmpty;
    const fillFrac = i < todayIdx ? 1 : i === todayIdx ? dayFrac : 0;
    bar.appendChild(makeSegment(fc, ec, fillFrac, 100/7));
    makeLabelPin(labels, (i+0.5)/7*100, name);
  });

  // Week day icons — group by day
  const grouped = {};
  WEEK_DAY_ICONS.forEach(wi => { if(!grouped[wi.dayIndex]) grouped[wi.dayIndex]=[]; grouped[wi.dayIndex].push(wi.icon); });
  Object.entries(grouped).forEach(([di, ics]) => {
    const basePct = (parseInt(di)+0.5)/7*100;
    ics.forEach((icon, ii) => {
      const offset = ics.length > 1 ? (ii-(ics.length-1)/2)*1.8 : 0;
      makeIconPin(icons, basePct+offset, icon);
    });
  });

  addMarker(bar, (todayIdx + dayFrac) / 7 * 100);
}

function renderYear(now) {
  const bar    = document.getElementById('year-bar');
  const labels = document.getElementById('year-labels');
  const icons  = document.getElementById('year-icons');
  bar.innerHTML = ''; labels.innerHTML = ''; icons.innerHTML = '';

  const year     = now.getFullYear();
  const isLeap   = (year%4===0 && year%100!==0) || year%400===0;
  const mDays    = [...MONTHS]; mDays[1] = {...mDays[1], days: isLeap ? 29 : 28};
  const totalDays = mDays.reduce((s,m)=>s+m.days,0);

  const month    = now.getMonth(); // 0-indexed
  const date     = now.getDate();  // 1-indexed

  let cumDays = 0;
  mDays.forEach((m, i) => {
    const wPct    = m.days / totalDays * 100;
    const midPct  = (cumDays + m.days/2) / totalDays * 100;
    const fillFrac = i < month ? 1 : i === month ? (date-1) / m.days : 0;

    bar.appendChild(makeSegment(m.fill, m.empty, fillFrac, wPct));
    makeLabelPin(labels, midPct, m.name);

    SPECIAL_DATES.filter(sd => sd.month === i).forEach(sd => {
      makeIconPin(icons, (cumDays + sd.day) / totalDays * 100, sd.icon);
    });

    cumDays += m.days;
  });

  const yearDaysPassed = mDays.slice(0, month).reduce((s,m)=>s+m.days,0) + (date-1);
  addMarker(bar, yearDaysPassed / totalDays * 100);
}

// ══════════════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════════════
function update() {
  const now = new Date();
  renderDay(now);
  renderWeek(now);
  renderYear(now);
}

update();
setInterval(update, 10 * 60 * 1000); // refresh every 10 minutes
</script>
</body>
</html>
